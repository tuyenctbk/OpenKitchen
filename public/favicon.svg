<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F110B"/>
      <stop offset="50%" stop-color="#2D150B"/>
      <stop offset="100%" stop-color="#C84B26"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="platterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F5DEB3"/>
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#FFB300" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Subtle Radial Glow behind dome -->
  <circle cx="32" cy="32" r="22" fill="#FF8A65" fill-opacity="0.18" />

  <!-- Rising Steam Swirls -->
  <path d="M26,14 Q27,10 26,7" fill="none" stroke="#FFE082" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.85"/>
  <path d="M32,13 Q33,9 32,6" fill="none" stroke="#FFE082" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M38,14 Q39,10 38,7" fill="none" stroke="#FFE082" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- Chef Hat / Cloche Dome Platter -->
  <!-- Chef Hat Plumes -->
  <ellipse cx="25" cy="22" rx="4.5" ry="5.5" fill="#FFFDF9"/>
  <ellipse cx="32" cy="20" rx="5.5" ry="6.5" fill="#FFFDF9"/>
  <ellipse cx="39" cy="22" rx="4.5" ry="5.5" fill="#FFFDF9"/>
  <!-- Hat Band -->
  <rect x="23" y="24.5" width="18" height="4" rx="1.5" fill="#FF6B35"/>

  <!-- Cloche Dome -->
  <path d="M18,43 C18,31 46,31 46,43 Z" fill="url(#platterGrad)" stroke="#FFE082" stroke-width="1"/>
  <!-- Cloche Handle Knob -->
  <circle cx="32" cy="30" r="3.2" fill="url(#goldGrad)"/>

  <!-- Platter Tray Base -->
  <rect x="13" y="43" width="38" height="4" rx="2" fill="url(#goldGrad)"/>
  <rect x="19" y="47" width="26" height="2" rx="1" fill="#E65100"/>

  <!-- Five-pointed star badge -->
  <polygon points="32,35 33.5,38.5 37.2,38.8 34.3,41.2 35.2,44.8 32,42.8 28.8,44.8 29.7,41.2 26.8,38.8 30.5,38.5" fill="#FFB300" stroke="#FFF" stroke-width="0.5"/>
</svg>
